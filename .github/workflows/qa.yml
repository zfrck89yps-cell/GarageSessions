name: Garage Sessions QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check inline JavaScript syntax
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('index.html','utf8');
          const match=html.match(/<script>([\s\S]*?)<\/script>/);
          if(!match)throw Error('App script missing');
          new vm.Script(match[1]);
          new vm.Script(fs.readFileSync('exercise-details.js','utf8'));
          new vm.Script(fs.readFileSync('exercise-additions.js','utf8'));
          console.log('PASS: JavaScript syntax');
          NODE
      - name: Install browser
        run: |
          npm install --no-save playwright jsdom
          npx playwright install --with-deps chromium webkit
      - name: Browser smoke tests
        run: node tests/smoke.cjs
      - name: Mobile WebKit smoke tests
        run: GS_BROWSER=webkit node tests/smoke.cjs
      - name: Rest timer regression tests
        run: node tests/rest-timer.cjs
      - name: Exercise details regression and coverage audit
        run: node tests/exercise-details.cjs
