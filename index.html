function dayPlan(){const d=new Date(),day=d.getDay();if(day===1||day===3||day===6){const strength=db.sessions.filter(s=>s.type==='strength').length;return db.plans.find(p=>p.id===(strength%2===0?'A':'B'))||db.plans[0]}if(day===2||day===4)return plan('C');return null}
function nav(){document.querySelector('#nav').innerHTML=[['home','Home'],['plans','Plans'],['progress','Progress'],['history','History'],['settings','More']].map(([id,t])=>'<button class="'+(tab===id?'active':'')+'" onclick="go(\''+id+'\')">'+t+'</button>').join('')}

function home(){let p=dayPlan(),n=db.sessions.length,b=db.body.at(-1);return '<p class="muted">REAL WORKOUTS. <span class="lime">REAL PROGRESS.</span></p><h1>SHOW UP.<br><span class="lime">GET STRONGER.</span></h1><div class="grid"><div class="card"><small>SESSIONS</small><div class="stat">'+n+'</div></div><div class="card"><small>LATEST WEIGHT</small><div class="stat">'+(b?b.kg+' kg':'—')+'</div></div></div><div class="card"><small>TODAY</small><h2>'+(p?esc(p.name):'Active recovery / rest')+'</h2><p class="muted">'+(p?'Your suggested session. You can choose another.':'Office walking, stairs or a proper rest day.')+'</p>'+(p?'<button class="btn" onclick="start(\''+p.id+'\')">START SESSION →</button>':'<button class="btn secondary" onclick="go(\'plans\')">Browse workouts</button>')+'</div><div class="card"><h3>YOUR WEEK</h3><p class="muted">Mon strength · Tue bike · Wed strength · Thu bike · Fri office walking · Sat strength · Sun rest</p><small>Strength alternates A/B each completed session. Start with 2 sets; progress to 3 when recovery is good.</small></div><button class="btn secondary" onclick="go(\'progress\')">VIEW PROGRESS →</button>'}
function plans(){return '<h1>YOUR <span class="lime">SESSIONS</span></h1>'+db.plans.map(p=>'<div class="card"><div class="split"><div><small>'+esc(p.type.toUpperCase())+'</small><h2>'+esc(p.name)+'</h2></div><button class="btn" onclick="start(\''+p.id+'\')">OPEN →</button></div><p class="muted">'+p.ex.map(e=>names[e[0]]||e[0]).join(' · ')+'</p><button class="ghost" onclick="editPlan(\''+p.id+'\')">Edit plan</button></div>').join('')+'<button class="btn secondary" onclick="addPlan()">+ Create plan</button>'}
function start(id){if(db.draft&&db.draft.plan!==id&&!confirm('Replace your unfinished session?'))return;selected=id;if(!db.draft||db.draft.plan!==id){let p=plan(id);db.draft={plan:id,date:date(),started:Date.now(),notes:db.notes[id]||'',exercises:p.ex.map(([eid,min,max])=>({id:eid,min,max,sets:Array.from({length:p.type==='cardio'?1:db.settings.sets},(_,i)=>({kg:db.weights[eid]??prevEx(eid)?.sets?.[i]?.kg??0,reps:min,done:false}))}))};save()}tab='workout';render()}
function advice(e){const prior=db.sessions.filter(s=>s.exercises?.some(x=>x.id===e.id)).slice(-4).map(s=>s.exercises.find(x=>x.id===e.id));if(prior.length<2)return 'Build consistency first; aim for clean reps.';const done=prior.slice(-2).every(x=>x.sets.length&&x.sets.every(z=>z.done&&Number(z.reps)>=e.max));const same=prior.slice(-2).every(x=>x.sets[0]?.kg===e.sets[0]?.kg);if(done&&same&&e.id!=='bike'){const w=Number(e.sets[0]?.kg)||0;return 'Progression cue: you reached the top of the rep range twice. Consider '+(w?((w+Math.max(1,Math.round(w*.05*2)/2))+' kg'):'the smallest available increase')+' next session, if technique is solid.'}return 'Keep this load until all sets reach '+e.max+' reps with good form.'}
function workout(){let d=db.draft;if(!d)return '<h2>No session open</h2><button class="btn" onclick="go(\'plans\')">Choose a plan</button>';let p=plan(d.plan);return '<div class="split"><h1>'+esc(p.name)+'</h1><button class="ghost" onclick="cancelWorkout()">Exit</button></div><p class="muted">'+fmt(d.date)+' · '+(p.type==='cardio'?'Minutes and resistance':'Weight in kg · reps per set')+'</p>'+d.exercises.map((e,i)=>'<div class="card"><div class="split"><h3>'+(i+1)+'. '+esc(names[e.id]||e.id)+'</h3><button class="ghost" aria-label="Exercise instructions" onclick="showInfo(\''+e.id+'\')">ⓘ</button></div><small>Target: '+e.min+'–'+e.max+(p.type==='cardio'?' minutes':' reps')+'</small><div class="hint">'+esc(advice(e))+'</div><div class="setrow tiny"><span>SET</span><span>'+(p.type==='cardio'?'RESISTANCE':'KG')+'</span><span>'+(p.type==='cardio'?'MIN':'REPS')+'</span><span>DONE</span></div>'+e.sets.map((s,j)=>'<div class="setrow"><span>'+(j+1)+'</span><input type="number" min="0" step=".5" value="'+esc(s.kg)+'" onchange="setField('+i+','+j+',\'kg\',this.value)"><input type="number" min="0" value="'+esc(s.reps)+'" onchange="setField('+i+','+j+',\'reps\',this.value)"><input aria-label="Set complete" type="checkbox" '+(s.done?'checked':'')+' onchange="setField('+i+','+j+',\'done\',this.checked)"></div>').join('')+'<button class="ghost" onclick="addSet('+i+')">+ Set</button> <button class="ghost" onclick="removeSet('+i+')">− Set</button></div>').join('')+'<div class="card"><h3>SESSION NOTES</h3><p class="muted">Last session note is carried forward and remains editable.</p><textarea rows="4" oninput="db.draft.notes=this.value;save()">'+esc(d.notes)+'</textarea></div><button class="btn" style="width:100%" onclick="finish()">FINISH & SAVE SESSION →</button>'}
function setField(i,j,k,v){db.draft.exercises[i].sets[j][k]=k==='done'?v:Number(v);save()}function addSet(i){const e=db.draft.exercises[i];e.sets.push({...e.sets.at(-1),done:false});save();render()}function removeSet(i){let s=db.draft.exercises[i].sets;if(s.length>1)s.pop();save();render()}function cancelWorkout(){tab='plans';render()}function finish(){let d=db.draft;if(!d.exercises.some(e=>e.sets.some(s=>s.done))&&!confirm('No completed sets. Save anyway?'))return;let p=plan(d.plan);d.type=p.type;d.completed=Date.now();db.sessions.push(d);db.notes[d.plan]=d.notes;d.exercises.forEach(e=>{let s=e.sets.findLast(s=>s.done);if(s)db.weights[e.id]=s.kg});db.draft=null;save();tab='history';render()}
function showInfo(id){let x=info[id]||['Use controlled form.',''];document.querySelector('#modalbody').innerHTML='<h2>'+esc(names[id]||id)+'</h2><h3>How to perform</h3><p>'+esc(x[0])+'</p><h3>Technique & safety</h3><p>'+esc(x[1])+'</p>';document.querySelector('#modal').showModal()}

function addBody(){let kg=Number(document.querySelector('#bweight').value),d=document.querySelector('#bdate').value;if(!d||!kg||kg<20||kg>400)return alert('Enter a valid date and weight.');db.body.push({date:d,kg});db.body.sort((a,b)=>a.date.localeCompare(b.date));save();render()}
function analysis(){let s=db.sessions,completed=s.filter(x=>x.type==='strength');let recent=s.filter(x=>Date.now()-new Date(x.date+'T12:00:00').getTime()<28*864e5);let days=completed.length?Math.round((Date.now()-new Date(completed[0].date).getTime())/864e5):0;return '<p><b>'+recent.length+'</b> sessions in the last 28 days · <b>'+completed.length+'</b> strength sessions overall.</p><p class="muted">'+(completed.length<6?'Not enough history for a reliable routine-change recommendation. Focus on consistent training and technique.':days>=56?'You have enough history to review the plan. Consider changing exercises only if progress has stalled, pain persists, or motivation is dropping.':'Continue building consistency. Review the routine after around 8–12 weeks.')+'</p>'}
function drawChart(){const c=document.querySelector('#chart');if(!c)return;const ctx=c.getContext('2d'),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);let data=chartMetric==='body'?db.body.map(b=>({date:b.date,v:Number(b.kg)})):db.sessions.flatMap(s=>{let e=s.exercises?.find(x=>x.id===chartMetric);return e?[{date:s.date,v:Math.max(...e.sets.filter(z=>z.done).map(z=>Number(z.kg)),0)}]:[]});data=data.filter(x=>Number.isFinite(x.v)).sort((a,b)=>a.date.localeCompare(b.date));ctx.font='20px system-ui';if(!data.length){ctx.fillStyle='#999';ctx.fillText('No measurements yet',20,110);return}let lo=Math.min(...data.map(x=>x.v)),hi=Math.max(...data.map(x=>x.v));if(lo===hi){lo-=1;hi+=1}const x=i=>42+i*(w-65)/Math.max(1,data.length-1),y=v=>h-40-(v-lo)/(hi-lo)*(h-70);ctx.strokeStyle='#333';for(let i=0;i<4;i++){let yy=20+i*(h-60)/3;ctx.beginPath();ctx.moveTo(40,yy);ctx.lineTo(w-15,yy);ctx.stroke()}ctx.strokeStyle='#c6ff00';ctx.lineWidth=4;ctx.beginPath();data.forEach((p,i)=>i?ctx.lineTo(x(i),y(p.v)):ctx.moveTo(x(i),y(p.v)));ctx.stroke();data.forEach((p,i)=>{ctx.fillStyle='#c6ff00';ctx.beginPath();ctx.arc(x(i),y(p.v),5,0,Math.PI*2);ctx.fill()});ctx.fillStyle='#aaa';ctx.font='16px system-ui';ctx.fillText(hi.toFixed(1),0,20);ctx.fillText(lo.toFixed(1),0,h-32);ctx.fillText(fmt(data[0].date),40,h-6);ctx.fillText(fmt(data.at(-1).date),w-130,h-6)}

/* Programme revision: FID bench and standard bar, 26 October 2026.
   Preserve workout history and user-created plans; upgrade only unchanged stock plans. */
(function migrateBenchProgramme(){
if(db.settings.benchProgrammeV2)return;
const old={A:['squat','press','row','rdl','pallof'],B:['step','push','bandrow','bridge','deadbug']};
for(const id of ['A','B']){
 const current=db.plans.find(p=>p.id===id),updated=templates.find(p=>p.id===id);
 if(!current)continue;
 if(current.ex.map(e=>e[0]).join('|')===old[id].join('|'))current.ex=structuredClone(updated.ex);
}
db.settings.benchProgrammeV2=true;save();
})();


/* Replace anchored resistance-band moves with anchor-free dumbbell work.
   Existing logs and customised programmes are retained. */
(function migrateAnchorFree(){
if(db.settings.anchorFreeV3)return;
for(const id of ['A','B']){
const p=db.plans.find(x=>x.id===id);if(!p)continue;
const old=id==='A'?['squat','inclinepress','benchrow','barbellrdl','pallof']:['step','flatpress','bandrow','bridge','deadbug'];
if(p.ex.map(e=>e[0]).join('|')===old.join('|'))p.ex=structuredClone(templates.find(x=>x.id===id).ex);
}
db.settings.anchorFreeV3=true;save();
})();


/* Correct suitcase exercise to a completely stationary timed hold. */
(function migrateStaticHold(){
if(db.settings.staticHoldV4)return;
const p=db.plans.find(x=>x.id==='A');
if(p){const e=p.ex.find(x=>x[0]==='suitcase');if(e&&e[1]===10&&e[2]===12){e[1]=20;e[2]=30}}
db.settings.staticHoldV4=true;save();
})();


/* Replace static hold with an active, stationary bench pullover. */
(function migratePulloverV5(){if(db.settings.pulloverV5)return;const p=db.plans.find(x=>x.id==='A');if(p){const e=p.ex.find(x=>x[0]==='suitcase');if(e&&e[1]===20&&e[2]===30){e[1]=10;e[2]=12}}db.settings.pulloverV5=true;save()})();
/* Garage Sessions advanced tracking */
let restTimer=null,restEnds=0,restSeconds=90;
function timerDisplay(){const n=document.querySelector('#timerdisplay');if(n)n.textContent=restEnds?Math.max(0,Math.ceil((restEnds-Date.now())/1000))+'s':'Ready';if(restEnds&&Date.now()>=restEnds){restEnds=0;clearInterval(restTimer);restTimer=null;if(n)n.textContent='Rest complete';if(navigator.vibrate)navigator.vibrate([150,80,150]);}}
function startRest(seconds=restSeconds){restSeconds=Number(seconds)||90;restEnds=Date.now()+restSeconds*1000;if(restTimer)clearInterval(restTimer);restTimer=setInterval(timerDisplay,500);timerDisplay()}

const anatomyKeys={chest:['chest','chest_upper'],back:['lats','upper_back','traps_mid','lower_back'],shoulders:['delt_front','delt_side','delt_rear'],triceps:['triceps'],biceps:['biceps','brachialis'],core:['abs','obliques'],quads:['quads'],hamstrings:['hamstrings'],glutes:['glutes']};
const anatomyNames={chest:'Chest',chest_upper:'Upper chest',lats:'Lats',upper_back:'Upper back',traps_mid:'Traps',lower_back:'Lower back',delt_front:'Front delts',delt_side:'Side delts',delt_rear:'Rear delts',biceps:'Biceps',triceps:'Triceps',abs:'Abs',obliques:'Obliques',quads:'Quads',hamstrings:'Hamstrings',glutes:'Glutes',calves:'Calves'};
function detailedMuscleMap(main,secondary=[]){
const p=new Set(main.flatMap(m=>anatomyKeys[m]||[m])),s=new Set(secondary.flatMap(m=>anatomyKeys[m]||[m]));
const figure=(side,paths,deco)=>{
const mir='matrix(-1 0 0 1 200 0)';
const path=(d,fill,stroke,extra='')=>'<path d="'+d+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width=".7" '+extra+'/>';
let svg='<svg viewBox="0 0 200 432" style="width:49%;height:auto;max-height:330px" role="img" aria-label="'+side+' anatomical muscle map"><ellipse cx="100" cy="26" rx="15" ry="19" fill="#777"/>'+path(SIL,'#686868','#aaa')+path(SIL,'#686868','#aaa','transform="'+mir+'"');
for(const [id,d] of paths){const color=p.has(id)?'#c6ff00':s.has(id)?'#6d9c22':'#454545';svg+=path(d,color,'#171717')+path(d,color,'#171717','transform="'+mir+'"')}
svg+=path(deco,'none','#202020')+path(deco,'none','#202020','transform="'+mir+'"')+'<text x="100" y="425" fill="#bbb" font-size="12" text-anchor="middle">'+side+'</text></svg>';return svg};
return '<div style="display:flex;gap:4px;justify-content:center;background:#111;border-radius:12px;padding:6px">'+figure('FRONT',FRONT,FRONT_DECO)+figure('BACK',BACK,BACK_DECO)+'</div><p style="font-size:.85rem"><span style="color:#c6ff00">■</span> Main muscles &nbsp; <span style="color:#6d9c22">■</span> Supporting muscles</p>';
}
muscleMap=function(active){return detailedMuscleMap(active)};
const dbRows=Array.isArray(window.EXERCISE_DB)?window.EXERCISE_DB:[];
const importedExercises=dbRows.map((row,i)=>({id:'fedb'+i,name:row[0],category:row[1],main:(row[2]||'').split(' ').filter(Boolean),secondary:(row[3]||'').split(' ').filter(Boolean),equipment:row[4],level:row[5],instructions:row[6],folder:row[7],imageCount:row[8]}));
const importedById=Object.fromEntries(importedExercises.map(e=>[e.id,e]));
for(const e of importedExercises){names[e.id]=e.name;exerciseCatalog.push([e.id,e.category,e.equipment])}
function exercisePhoto(e,i){return 'https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/'+e.folder.split('/').map(encodeURIComponent).join('/')+'/'+i+'.jpg'}
function importedInfo(id){const e=importedById[id];if(!e)return;const list=e.instructions.split(/\n+/).map(s=>s.trim()).filter(Boolean);const imgs=e.folder&&e.imageCount?'<div class="grid">'+Array.from({length:Math.min(2,e.imageCount)},(_,i)=>'<img loading="lazy" style="width:100%;border-radius:10px;background:#333" src="'+exercisePhoto(e,i)+'" alt="'+esc(e.name)+' demonstration '+(i+1)+'" onerror="this.style.display=\'none\'">').join('')+'</div>':'';
document.querySelector('#modalbody').innerHTML='<h2>'+esc(e.name)+'</h2>'+detailedMuscleMap(e.main,e.secondary)+imgs+'<p><b>Equipment:</b> '+esc(e.equipment)+' · <b>Level:</b> '+esc(e.level)+'</p>'+guideSection('How to perform',list)+'<p class="muted">Exercise instructions and demonstration images: Free Exercise DB (public domain). Start with a manageable load and adapt range of motion to your comfort and equipment.</p>';document.querySelector('#modal').showModal()}
const priorShowInfoImported=showInfo;
showInfo=function(id){if(importedById[id])return importedInfo(id);const c=coaching[id];if(c){const originalMap=muscleMap;muscleMap=function(){return detailedMuscleMap(c.muscles)};try{return priorShowInfoImported(id)}finally{muscleMap=originalMap}}return priorShowInfoImported(id)};
let libraryEquipment='All';
const priorLibraryPage=libraryPage;
libraryPage=function(){const html=priorLibraryPage();const options=['All','Dumbbell','Barbell','Body only','Machine','Cable','Kettlebell','Bands','Other'];return html.replace('<div id="libraryresults">','<label>Equipment</label><select onchange="libraryEquipment=this.value;render()">'+options.map(o=>'<option '+(libraryEquipment===o?'selected':'')+'>'+o+'</option>').join('')+'</select><p class="muted">'+importedExercises.length+' imported exercises, plus Garage Sessions originals. Some require equipment you may not own.</p><div id="libraryresults">')};
libraryResults=function(){const q=librarySearch.toLowerCase().trim();const filtered=exerciseCatalog.filter(([id,cat,eq])=>(libraryFilter==='All'||cat===libraryFilter)&&(libraryEquipment==='All'||(eq||'').toLowerCase().includes(libraryEquipment.toLowerCase()))&&(!q||names[id].toLowerCase().includes(q)));return filtered.slice(0,80).map(([id,cat,eq])=>'<div class="card"><div class="split"><div><h3>'+esc(names[id])+'</h3><small>'+esc(cat)+' · '+esc(eq)+'</small></div><button class="ghost" onclick="showInfo(\''+id+'\')">ⓘ</button></div><button class="btn secondary" onclick="addToPlanFromLibrary(\''+id+'\')">+ Add to plan</button></div>').join('')+(filtered.length>80?'<p class="muted">Showing first 80 of '+filtered.length+' matches. Search or filter to narrow the results.</p>':'')||'<p>No matching exercises.</p>'};

render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
